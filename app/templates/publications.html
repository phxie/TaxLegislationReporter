{% extends "base.html" %}
{% block title %}Publications — Tax Legislation Reporter{% endblock %}
{% block content %}

<article>
  <h3>Publications</h3>
  <form class="filters" hx-get="/publications/partials/list" hx-target="#publication-table" hx-swap="outerHTML"
        hx-trigger="change from:select[name='source'], change from:select[name='relevant_jurisdiction'], change from:input[type='date'], keyup delay:400ms from:input[name='keyword']">
    <label>Source
      <select name="source">
        <option value="">All</option>
        {% for code, label in sources %}
        <option value="{{ code }}" {{ "selected" if filters.source == code else "" }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Jurisdiction
      <select name="relevant_jurisdiction">
        <option value="">All</option>
        {% for j in jurisdictions %}
        <option value="{{ j }}" {{ "selected" if filters.relevant_jurisdiction == j else "" }}>{{ j }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Keyword
      <input type="text" name="keyword" value="{{ filters.keyword }}" placeholder="e.g. GILTI">
    </label>
    <label>From
      <input type="date" name="date_from" value="{{ filters.date_from or '' }}">
    </label>
    <label>To
      <input type="date" name="date_to" value="{{ filters.date_to or '' }}">
    </label>
  </form>

  {% include "partials/publication_table.html" %}
</article>

{% endblock %}
