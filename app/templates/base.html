<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tax Legislation Reporter{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/pico.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/css/custom.css">
  <script src="/static/js/htmx.min.js"></script>
  <style>
    .recent { background: var(--accent-bg); }
  </style>
</head>
<body>
  <nav class="top">
    <a class="brand" href="/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8 L12 2.5 L21 8"/><line x1="3" y1="8" x2="21" y2="8"/>
        <line x1="4.5" y1="10" x2="4.5" y2="18.5"/><line x1="9.2" y1="10" x2="9.2" y2="18.5"/>
        <line x1="14.8" y1="10" x2="14.8" y2="18.5"/><line x1="19.5" y1="10" x2="19.5" y2="18.5"/>
        <line x1="2.5" y1="20.5" x2="21.5" y2="20.5"/>
      </svg>
      <span class="brand-text">
        <strong>TaxLeg Reporter</strong>
        <small>Legislative Intelligence</small>
      </span>
    </a>
    <div class="links">
      <ul>
        <li><a href="/" class="{{ 'active' if not request.url.path.startswith('/publications') else '' }}">Bills</a></li>
        <li><a href="/publications" class="{{ 'active' if request.url.path.startswith('/publications') else '' }}">Publications</a></li>
      </ul>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
